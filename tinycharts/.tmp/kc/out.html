<style>:root {
  --page: #e6dfd2; --paper: #faf6ee; --ink: #2b2a28; --red: #b5483b; --line: #cfc6b8;
  --serif: "Young Serif", Georgia, serif; --hand: Gaegu, "DM Sans", sans-serif; --ui: "DM Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--ink); font: 15px/1.4 var(--ui);
  display: grid; grid-template: 80px 1fr / 344px 1fr; grid-template-areas: "top top" "side stage";
}

/* sheet lettering */
text.tt { font-family: var(--serif); }
text.it { font-family: var(--hand); font-size-adjust: .5; letter-spacing: .5px; }
text.cap { font-family: var(--hand); font-size-adjust: .5; letter-spacing: 1.4px; text-transform: uppercase; }
text.kicker { letter-spacing: 2.4px; }

/* marks inside a state group show only while that state is lit */
[data-state]:not(.lit) .on { display: none; }
/* the now marks drop in when a state lights: ease out, a little settle */
@keyframes tc-pop { from { opacity: 0; transform: translateY(-10px); } 70% { opacity: 1; transform: translateY(1.5px); } to { transform: none; } }
/* a line does not hop: a hop shows the line under it. It fades in where it lies. */
@keyframes tc-fade { from { opacity: 0; } }
#art [data-state].lit.pop .on > * { animation: tc-pop 340ms cubic-bezier(.2, 0, 0, 1); }
#art [data-state].lit.pop .on > .flat-in { animation: tc-fade 340ms ease-out; }
body.bare #art [data-state].lit .on > *, body.audit #art [data-state].lit .on > * { animation: none; }

#top {
  grid-area: top; display: flex; align-items: center; gap: 24px; padding: 0 20px;
  border-bottom: 1px solid var(--line);
}
#back {
  background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 500; font-size: 17px;
  padding: 14px 22px; border-radius: 6px;
}
#kind { flex: 1; display: flex; flex-direction: column; align-items: center; }
#kind b { font: 400 24px/1.1 var(--serif); }
#kind small { font: 17px/1.2 var(--hand); color: var(--red); letter-spacing: .5px; }
#pager { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--ink); border-radius: 22px; padding: 6px 14px; }
#pager button { background: none; border: 0; font-size: 18px; cursor: pointer; color: var(--ink); }
#pager[hidden], #logicBtn[hidden] { display: none; }
#logicBtn {
  background: var(--red); color: var(--paper); border: 0; border-radius: 22px; padding: 10px 18px;
  font: 500 16px var(--ui); cursor: pointer;
}

#side { grid-area: side; padding: 20px; border-right: 1px solid var(--line); }
.try { margin: 0 0 10px; font: 500 12px/1 var(--ui); letter-spacing: 1.6px; text-transform: uppercase; color: #6d665e; }
#actions { display: flex; flex-direction: column; gap: 9px; }
#actions button {
  font: 16px var(--ui); color: var(--red); background: var(--paper); border: 1.5px solid var(--red);
  border-radius: 24px; padding: 11px 16px; cursor: pointer;
}
#actions button:hover { background: #f6e6e0; }
#actions button.run { background: var(--red); color: var(--paper); font-weight: 500; }
#actions button.reset { color: #6d665e; border-color: #b9b0a4; }
#actions button.reset:hover { background: #efe9df; }
#hint, #status { font: 18px/1.5 var(--hand); font-size-adjust: .5; letter-spacing: .5px; margin: 26px 2px 0; }
#status:empty { display: none; }
#error { color: var(--red); white-space: pre-wrap; font: 13px var(--ui); }

#stage { grid-area: stage; overflow: auto; display: grid; place-items: start center; padding: 16px 24px 40px; }
#frame { position: relative; width: min(100%, calc((100vh - 120px) * var(--ratio, 1))); }
#zoom { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 6px rgba(60, 50, 40, .12); }
#zoom button { font: 14px var(--ui); background: none; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
#zoom button:hover { background: var(--line); }
#zoom .pct { font: 13px var(--ui); min-width: 42px; text-align: center; }
#sheet.zoomed { cursor: grab; touch-action: none; }
body.bare #zoom, body.gallery #zoom { display: none; }
#where { position: absolute; top: 12px; left: 12px; z-index: 2; display: grid; gap: 2px; padding: 8px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 6px rgba(60, 50, 40, .12); font-family: var(--hand); letter-spacing: .5px; pointer-events: none; }
#where b { font-size: 20px; font-weight: 400; }
#where span { font-size: 15px; color: #6d665e; }
#where[hidden], body.bare #where, body.gallery #where { display: none; }
#sheet {
  width: 100%; aspect-ratio: var(--ratio, 1); height: auto; display: block;
  box-shadow: 2px 3px 0 rgba(60, 50, 40, .12), 0 1px 8px rgba(60, 50, 40, .08); background: var(--paper);
}

/* bare: the sheet alone at 1:1, for export */
body.bare { display: block; background: var(--paper); }
body.bare #top, body.bare #side { display: none; }
body.bare #stage { padding: 0; display: block; overflow: visible; place-items: normal; }
body.bare #frame { width: auto; }
body.bare #sheet { width: auto; height: auto; box-shadow: none; display: block; }
pre#audit, pre#fonts, pre#selftest { display: none; }

/* the logic panel */
body.with-logic { grid-template: 80px 1fr / 344px 1fr minmax(420px, 40%); grid-template-areas: "top top top" "side stage logic"; }
#logic { grid-area: logic; overflow: auto; padding: 22px 24px; border-left: 1px solid var(--line); background: #faf6ee; }
#logic[hidden] { display: none; }
#logic header { display: flex; justify-content: space-between; align-items: center; }
#logic h2 { font: 400 26px/1.1 var(--serif); margin: 0; }
#logic .close { background: none; border: 0; font-size: 26px; cursor: pointer; color: var(--ink); }
#logic .intro, #logic .checked { color: #6d665e; font-size: 14px; }
#logic .rules { list-style: none; padding: 0; margin: 18px 0; }
#logic .rules li { border-left: 3px solid var(--red); padding: 2px 0 2px 14px; margin: 0 0 16px; }
#logic .rules p { margin: 0; }
#logic .rule { font-weight: 500; }
#logic .says { color: #4d4741; font-size: 14px; }
#logic .breaks { color: var(--red); font: 16px/1.4 var(--hand); font-size-adjust: .5; letter-spacing: .5px; margin-top: 4px !important; }
#logic .tools { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
#logic .tools[hidden], #logic .chart[hidden] { display: none; }
#logic .tools .gap { flex: 1; }
#logic .tools button { font: 14px var(--ui); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
#logic .pct { font-size: 13px; color: #6d665e; min-width: 42px; text-align: center; }
#logic .chart { border: 1px solid var(--line); border-radius: 8px; overflow: auto; text-align: center; padding: 12px; max-height: 60vh; background: var(--paper); }
#logic .chart:fullscreen { max-height: none; }
.pele {
  --pele-bg: #faf6ee; --pele-fg: #2b2a28; --pele-muted: #6d665e; --pele-line: #2b2a28;
  --pele-surface: #f3ead8; --pele-surface-alt: #e9dcc2; --pele-border: #8a8277; --pele-accent: #b5483b;
  --pele-font: "DM Sans", sans-serif; --pele-radius: 8px;
}
.pele-state[data-id] { cursor: pointer; }
.pele-state.now rect { stroke: var(--red); stroke-width: 2.4; fill: #f6e6e0; }
#art [data-state].peek { filter: drop-shadow(0 0 5px rgba(181, 72, 59, .9)); }

/* the gallery */
body.gallery #side { display: none; }
body.gallery { display: block; }
body.gallery #top { height: 80px; }
body.gallery #stage { display: block; place-items: normal; padding: 28px 40px 60px; }
body.gallery #back[hidden] { display: none; }
#cards section { margin: 0 0 30px; }
#cards h2 { font: 500 12px/1 var(--ui); letter-spacing: 1.6px; text-transform: uppercase; color: #6d665e; margin: 0 0 12px; }
#cards .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card {
  display: block; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px 18px 16px;
  color: var(--ink); text-decoration: none; box-shadow: 1px 2px 0 rgba(60, 50, 40, .08);
}
.card:hover { border-color: var(--red); }
.card b { display: block; font: 400 22px/1.15 var(--serif); }
.card small { display: block; margin-top: 6px; font: 17px/1.3 var(--hand); font-size-adjust: .5; color: var(--red); letter-spacing: .5px; }
#pager button:disabled { opacity: .3; cursor: default; }
.person[data-say] { cursor: pointer; }
</style>
</head>

const C = 0.8660254, S = 0.5;

const INK = '#2b2a28', RED = '#b5483b', PAPER = '#faf6ee';
const PAL = {

  bark: '#8a6a4f', sage: '#b9cba8', leaf: '#8fae84', mint: '#cfe0d2', sky: '#c9d6e6',
  blue: '#8ea6c8', navy: '#5f7db5', lilac: '#cfd0e6', rose: '#e6c3bb', brick: '#c8836b',

function at(sx, sy) {

let out = [], under = [], _queue = [], _qn = 0;

const DEFS = [];

function put(key, sub, fn) { _queue.push({ key, sub, n: _qn++, fn }); }

function group(attrs, fn) { out.push(`<g ${attrs}>`); fn(); out.push('</g>'); }

function n1(v) { return String(Math.round(v * 10) / 10); }

function _rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

const _palList = Object.values(PAL);
// Markers only come in muted tones: pull any colour part way to its nearest marker.
function soften(c) {

/* Tinycharts kit: the pen. The hand model is ported from statechart-art's

   follows a pressure profile. statechart-art stamps discs on a canvas; here

const _clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);

// A few incommensurate sines: f(s) in about [-1, 1].
function wander(lamMin, lamMax, n = 3) {

    const amp = Math.pow(lam / lamMax, 0.35) * (0.6 + 0.8 * rnd());

function _catmull(pts, step) {

    const m = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));

const _DS = 1.6, _LAG = 7;

// The path a hand makes when it aims at pts (sheet points).

function _strokeD(pts, w, amp, over, curve = false) {

  for (let i = 1; i < h.length; i++) cum.push(cum[i - 1] + Math.hypot(h[i][0] - h[i - 1][0], h[i][1] - h[i - 1][1]));

function rim(pts, w = 1.4, col = INK) {
  const d = pts.map((p, i) => _strokeD([p, pts[(i + 1) % pts.length]], w, 0.7, 1.2)).join('');

function rule(pairs, col = INK, w = 0.6) {
  const d = pairs.map(([a, b]) => _strokeD([a, b], w, 0.5, 0.8)).join('');
  if (d) out.push(`<path d="${d}" fill="${col}"/>`);

function dash(a, b, col = '#7f9db3', on = 6, off = 5, w = 1.1) {
  const L = Math.hypot(b[0] - a[0], b[1] - a[1]), pairs = [];

/* Tinycharts kit: marker washes, the paper texture and shadows. */

const SHADOW = '#d9d1c2';

let _texPng = null;
DEFS.push(toothDefs);

// A marker wash: the colour lands a little off the ink line, pools at its edge, and shows the paper.
function fill(pts, col, { dx = 1.3, dy = 0.9, amp = 1 } = {}) {
  const c = soften(col);
  const poly = pts.map(p => [p[0] + dx + (rnd() - 0.5) * amp, p[1] + dy + (rnd() - 0.5) * amp]);
  const d = pathOf(poly, true);
  out.push(`<path d="${d}" fill="${c}" stroke="${shadeOf(c)}" stroke-opacity=".28" stroke-width="1.3" stroke-linejoin="round"/><path d="${d}" fill="url(#tex)"/>`);

function flat(pts, col) { out.push(`<path d="${pathOf(pts, true)}" fill="${col}"/>`); }

function hull(pts) {
  const p = pts.map(q => q.slice()).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;

  for (const q of p.slice().reverse()) { while (hi.length > 1 && cr(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }

}

// Parallel ink lines across a polygon (sheet points).
function hatch(poly, { dir = [0, 1], gap = 5.5, w = 0.7, col = INK, keep = 0.86, from = 0, to = 1 } = {}) {
  const dl = Math.hypot(dir[0], dir[1]) || 1, ux = dir[0] / dl, uy = dir[1] / dl, nx = -uy, ny = ux;
  const ns = poly.map(p => p[0] * nx + p[1] * ny), pairs = [];
  for (let c = Math.min(...ns) + gap / 2; c < Math.max(...ns); c += gap) {
    const hits = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], na = ns[i], nb = ns[(i + 1) % poly.length];
      if ((na - c) * (nb - c) < 0) { const t = (c - na) / (nb - na); hits.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
    }
    hits.sort((p, q) => (p[0] * ux + p[1] * uy) - (q[0] * ux + q[1] * uy));
    for (let i = 0; i + 1 < hits.length; i += 2) {
      if (rnd() > keep) continue;
      const a = hits[i], b = hits[i + 1], L = (t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      pairs.push([L(from), L(to)]);
    }
  }
  if (pairs.length) rule(pairs, col, w);
}

// A soft shadow laid on the ground before any solid is drawn.
function ground(pts) {
  const h = hull(pts);
  if (h.length < 3) return;
  const soft = hand([...h, h[0], h[1]], 0.4, 0, true);
  const d = pathOf(soft, true);
  under.push(`<path class="shadow" d="${d}" fill="${SHADOW}" fill-opacity=".62"/><path d="${d}" fill="url(#tex)" fill-opacity=".7"/>`);
}

// Light comes from the upper left, so a shadow runs toward +x and a little +y.
function cast(x, y, w, d, h, z = 0) {
  const f = [[x, y], [x + w, y], [x + w, y + d], [x, y + d]], ox = 0.5 * h + 6, oy = 0.12 * h + 4;
  ground([...f, ...f.map(([a, b]) => [a + ox, b + oy])].map(([a, b]) => P(a, b, z)));
}

function castDisc(x, y, r, h, z = 0) {
  const ring = [];
  for (let i = 0; i < 16; i++) { const t = i / 16 * 2 * Math.PI; ring.push([x + Math.cos(t) * (r + 3), y + Math.sin(t) * (r + 3)]); }
  const ox = 0.5 * h + 4, oy = 0.12 * h + 3;
  ground([...ring, ...ring.map(([a, b]) => [a + ox, b + oy])].map(([a, b]) => P(a, b, z)));
}

/* Tinycharts kit: solids and buildings. All take world coordinates.
   The viewer sees the top, the +x face (down-right on the sheet) and the
   +y face (down-left). Following the Free kit's naming, `left` colours the
   +x face and the +y face gets its shade. */

const _f3 = v => String(Math.round(v * 1000) / 1000);
const MARK = '#8a8277';

function faceM(face, x, y, z, s = 1) {
  const [e, f] = P(x, y, z);
  const m = face === 'top' ? [C, S, -C, S] : face === 'right' ? [C, -S, 0, 1] : [C, S, 0, 1];
  return `matrix(${m.map(v => _f3(v * s)).join(' ')} ${n1(e)} ${n1(f)})`;
}

// Construction lines that run on a little past a corner, as in a drafted plate.
function _marks(corners) {
  const pairs = [];
  for (const [p, q] of corners) {
    const dx = p[0] - q[0], dy = p[1] - q[1], d = Math.hypot(dx, dy) || 1;
    pairs.push([p, [p[0] + dx / d * 7, p[1] + dy / d * 7]]);
  }
  rule(pairs, MARK, 0.45);
}

function box(x, y, z, w, d, h, { top, left = PAL.shade, ink = 2, marks = true } = {}) {
  const x1 = x + w, y1 = y + d, z1 = z + h;
  const A = P(x, y, z1), B = P(x1, y, z1), Cc = P(x1, y1, z1), D = P(x, y1, z1);
  const E = P(x1, y, z), F = P(x1, y1, z), G = P(x, y1, z);
  fill([G, F, Cc, D], shadeOf(left));
  fill([E, F, Cc, B], left);
  fill([A, B, Cc, D], top || litOf(left));
  rim([A, B, E, F, G, D], ink * 0.8);
  rule([[Cc, B], [Cc, D], [Cc, F]], INK, ink * 0.55);
  if (marks) _marks([[F, E], [F, G], [D, A], [B, A]]);
}

function _ring(cx, cy, cz, r, n = 36) {
  const pts = [];
  for (let i = 0; i < n; i++) { const t = i / n * 2 * Math.PI; pts.push(P(cx + Math.cos(t) * r, cy + Math.sin(t) * r, cz)); }
  return pts;
}

// Front half of a horizontal circle, from its left extreme round the bottom to its right extreme.
// The sheet's left extreme is the world direction (-1, 1), the lowest point (1, 1), the right extreme (1, -1).
function _front(cx, cy, cz, r, n = 24) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = (0.75 - i / n) * Math.PI; pts.push(P(cx + Math.cos(t) * r, cy + Math.sin(t) * r, cz)); }
  return pts;
}

function turn(x, y, z, prof, col, { cap = null, ink = 0.9, seam = true, wall = 0, sink = 4 } = {}) {
  const k = 1.2247449, [cx, cy] = P(x, y, z);
  const L = prof.map(([r, h]) => [cx - r * k, cy - h]), R = prof.map(([r, h]) => [cx + r * k, cy - h]);
  const [r0, h0] = prof[0], [rt, ht] = prof[prof.length - 1];
  const bottom = _front(x, y, z + h0, r0), topBack = _front(x, y, z + ht, rt).map(([a, b]) => [a, 2 * (cy - ht) - b]).reverse();
  const body = [...L.slice().reverse(), ...bottom, ...R, ...topBack];
  fill(body, col);
  // a band of shade down the right side gives the body its roundness
  flat([...R.map(([a, b], i) => [a - prof[i][0] * k * 0.28, b]), ...R.slice().reverse()], 'rgba(58,52,48,.10)');
  const top = _ring(x, y, z + ht, rt);
  fill(top, wall ? shadeOf(col) : (cap || litOf(col)));
  if (wall) fill(_ring(x, y, z + ht - sink, Math.max(1, rt - wall)), cap || shadeOf(shadeOf(col)));
  line([...L.slice().reverse(), ...bottom, ...R], { w: ink * 1.6, over: 0 });
  rim(top, ink * 1.2);
  if (seam) for (let i = 1; i < prof.length - 1; i++) line(_front(x, y, z + prof[i][1], prof[i][0]), { w: ink * 0.6, over: 0 });
}

function cyl(x, y, z, r, h, col, { ink = 1.4, cap = null } = {}) { turn(x, y, z, [[r, 0], [r, h]], col, { cap, ink: ink * 0.7, seam: false }); }

// The ground: a cut slab with square corners, as in an architect's site model.
function board(x, y, w, d, h, top, side) { box(x, y, -h, w, d, h, { top, left: side, ink: 1.8, marks: false }); }

let _clipN = 0;
function clipped(pts, fn) {
  const id = 'c' + (++_clipN);
  out.push(`<clipPath id="${id}"><path d="${pathOf(pts, true)}"/></clipPath><g clip-path="url(#${id})">`);
  fn();
  out.push('</g>');
}

// A block with real walls: the roof deck is sunk behind a parapet you can see over.
function block(x, y, z, w, d, h, { wall = PAL.tan, deck = '#cfc6b8', t = 7, sink = 9, ink = 2 } = {}) {
  box(x, y, z, w, d, h, { left: wall, top: litOf(wall), ink });
  const zt = z + h, zd = zt - sink, xi = x + t, yi = y + t, xo = x + w - t, yo = y + d - t;
  const hole = [P(xi, yi, zt), P(xo, yi, zt), P(xo, yo, zt), P(xi, yo, zt)];
  clipped(hole, () => {
    fill([P(xi, yi, zd), P(xi, yo, zd), P(xi, yo, zt), P(xi, yi, zt)], shadeOf(wall));
    fill([P(xi, yi, zd), P(xo, yi, zd), P(xo, yi, zt), P(xi, yi, zt)], shadeOf(shadeOf(wall)));
    fill([P(xi, yi, zd), P(xo, yi, zd), P(xo, yo, zd), P(xi, yo, zd)], deck);
    rule([[P(xi, yi, zd), P(xo, yi, zd)], [P(xi, yi, zd), P(xi, yo, zd)]], INK, 0.7);
  });
  rim(hole, ink * 0.5);
}

function gable(x, y, w, d, h, rise, { wall = PAL.sand, roof = PAL.slate, eave = 8 } = {}) {
  const x1 = x + w, y1 = y + d, ym = y + d / 2, zr = h + rise;
  box(x, y, 0, w, d, h, { left: wall, top: wall });
  const end = [P(x1, y, h), P(x1, y1, h), P(x1, ym, zr)];
  fill(end, wall);
  rim(end, 1.6);
  // eaves stand off the walls a little on every side
  const back = [P(x - eave, y - eave * 0.6, h - eave * 0.6), P(x1 + eave, y - eave * 0.6, h - eave * 0.6), P(x1 + eave, ym, zr), P(x - eave, ym, zr)];
  const front = [P(x - eave, ym, zr), P(x1 + eave, ym, zr), P(x1 + eave, y1 + eave * 0.6, h - eave * 0.6), P(x - eave, y1 + eave * 0.6, h - eave * 0.6)];
  fill(back, shadeOf(roof)); rim(back, 1.4);
  fill(front, roof);
  const courses = [];
  for (let t = 0.12; t < 1; t += 0.12) {
    const a = [front[0][0] + (front[3][0] - front[0][0]) * t, front[0][1] + (front[3][1] - front[0][1]) * t];
    const b = [front[1][0] + (front[2][0] - front[1][0]) * t, front[1][1] + (front[2][1] - front[1][1]) * t];
    courses.push([a, b]);
  }
  rule(courses, INK, 0.5);
  rim(front, 1.7);
  line([front[0], front[1]], { w: 3.2 });
  line([front[3], front[2]], { w: 2.4 });
}

function _faceRect(face, x, y, z, w, h) {
  return face === 'R' ? [P(x, y, z), P(x, y - w, z), P(x, y - w, z + h), P(x, y, z + h)]
    : [P(x, y, z), P(x + w, y, z), P(x + w, y, z + h), P(x, y, z + h)];
}
function _inset(q, t) {
  const cx = q.reduce((s, p) => s + p[0], 0) / 4, cy = q.reduce((s, p) => s + p[1], 0) / 4;
  return q.map(([a, b]) => [a + (cx - a) * t, b + (cy - b) * t]);
}

function _window(face, x, y, z, w, h) {
  const o = _faceRect(face, x, y, z, w, h);
  fill(o, '#efe8da'); rim(o, 1.2);
  const g = _inset(o, 0.16);
  fill(g, '#aebfd2'); rim(g, 0.8);
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  rule([[mid(g[0], g[1]), mid(g[3], g[2])], [mid(g[0], g[3]), mid(g[1], g[2])]], INK, 0.7);
  line([[o[0][0] - (o[1][0] - o[0][0]) * 0.08, o[0][1] + 2], [o[1][0] + (o[1][0] - o[0][0]) * 0.08, o[1][1] + 2]], { w: 2.4 });
}
function windowL(x, y, z, w, h) { _window('L', x, y, z, w, h); }
function windowR(x, y, z, w, h) { _window('R', x, y, z, w, h); }

function _door(face, x, y, z, w, h, col) {
  const o = _faceRect(face, x, y, z, w, h);
  fill(o, col); rim(o, 1.4);
  const lo = _inset(_faceRect(face, x, y, z + h * 0.08, w, h * 0.4), 0.22), hi = _inset(_faceRect(face, x, y, z + h * 0.52, w, h * 0.4), 0.22);
  rim(lo, 0.7); rim(hi, 0.7);
  const kx = face === 'R' ? P(x, y - w * 0.82, z + h * 0.48) : P(x + w * 0.82, y, z + h * 0.48);
  out.push(`<circle cx="${n1(kx[0])}" cy="${n1(kx[1])}" r="1.8" fill="${INK}"/>`);
}
function doorL(x, y, z, w, h, col) { _door('L', x, y, z, w, h, col); }
function doorR(x, y, z, w, h, col) { _door('R', x, y, z, w, h, col); }

// A flight of steps climbing along axis ('x', 'y', '-x' or '-y'): n steps
// of `go` by `up`, `wd` wide. x, y is the foot. Steps that climb away from
// the viewer ('-x', '-y') are drawn top step first, so nearer steps cover it.
function flight(x, y, z, n, go, up, wd, axis = 'x', col = '#e4dbcb') {
  const back = axis[0] === '-', ax = axis.slice(-1);
  for (let k = 0; k < n; k++) {
    const i = back ? n - 1 - k : k, at = back ? -(i + 1) * go : i * go, o = { left: col, marks: false, ink: 1.4 };
    if (ax === 'x') box(x + at, y, z, go, wd, up * (i + 1), o);
    else box(x, y + at, z, wd, go, up * (i + 1), o);
  }
}

function fence(pts, { col = PAL.wood, post = 26, gap = 22 } = {}) {
  const posts = [];
  for (let i = 0; i + 1 < pts.length; i++) {
    const [a, b] = [pts[i], pts[i + 1]], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(L / gap));
    for (let j = 0; j < n; j++) posts.push([a[0] + (b[0] - a[0]) * j / n, a[1] + (b[1] - a[1]) * j / n]);
  }
  posts.push(pts[pts.length - 1]);
  for (const zr of [post * 0.38, post * 0.78]) line(pts.map(([px, py]) => P(px, py, zr)), { w: 2.2, col: shadeOf(col) });
  for (const [px, py] of posts.sort((p, q) => (p[0] + p[1]) - (q[0] + q[1]))) box(px - 1.5, py - 1.5, 0, 3, 3, post, { left: col, marks: false, ink: 0.9 });
}

function _offset(pts, o) {
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    return [p[0] - dy * o, p[1] + dx * o];
  });
}

// A pipe along sheet points.
function pipe(pts, w, col = '#a6a4a4') {
  out.push(`<path d="${pathOf(pts)}" fill="none" stroke="${soften(col)}" stroke-width="${n1(w)}" stroke-linejoin="round"/>`);
  out.push(`<path d="${pathOf(_offset(pts, -w * 0.18))}" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="${n1(w * 0.22)}" stroke-linejoin="round"/>`);
  line(_offset(pts, w / 2), { w: 1.2, over: 0 });
  line(_offset(pts, -w / 2), { w: 1.2, over: 0 });
}

/* Tinycharts kit: people, animals and plants. They stay round and friendly,
   however exact the buildings around them are. The doll's proportions,
   poses, limbs and hair are ported from statechart-art's tools/lib/people.js
   (MIT, Kevin T. Ngo). */

const SKIN = '#f2dcc5', HAIR = '#3b3330', PAPERW = '#fffdf8';

function oval(cx, cy, rx, ry = rx, n = 20) {
  const pts = [];
  for (let i = 0; i < n; i++) { const t = i / n * 2 * Math.PI; pts.push([cx + Math.cos(t) * rx, cy + Math.sin(t) * ry]); }
  return pts;
}

// Smooth outline through a few points (closed by default).
function spline(pts, closed = true, step = 1.4) {
  if (!closed) return _catmull(pts, step);
  const n = pts.length, res = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const m = Math.max(1, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / step));
    for (let k = 0; k < m; k++) {
      const t = k / m, t2 = t * t, t3 = t2 * t;
      res.push([0, 1].map(c => 0.5 * (2 * p1[c] + (-p0[c] + p2[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * t3)));
    }
  }
  return res;
}

// A soft round shape; bump > 0 makes it lumpy like a bush.
function blob(cx, cy, rx, ry, bump = 0, k = 7) {
  const ph = rnd() * 6.28, pts = [];
  for (let i = 0; i < 40; i++) {
    const t = i / 40 * 2 * Math.PI, r = 1 + bump * (0.5 + 0.5 * Math.cos(t * k + ph)) + (rnd() - 0.5) * 0.03;
    pts.push([cx + Math.cos(t) * rx * r, cy + Math.sin(t) * ry * r]);
  }
  return pts;
}

function capsule(a, b, ra, rb = ra, n = 12) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), res = [];
  for (let i = 0; i <= n; i++) { const t = ang + Math.PI / 2 + (i / n) * Math.PI; res.push([a[0] + Math.cos(t) * ra, a[1] + Math.sin(t) * ra]); }
  for (let i = 0; i <= n; i++) { const t = ang - Math.PI / 2 + (i / n) * Math.PI; res.push([b[0] + Math.cos(t) * rb, b[1] + Math.sin(t) * rb]); }
  return res;
}

function limbOf(pts, r) {
  const Lf = [], Rt = [];
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const nx = -(b[1] - a[1]) / d * r, ny = (b[0] - a[0]) / d * r;
    Lf.push([p[0] + nx, p[1] + ny]); Rt.push([p[0] - nx, p[1] - ny]);
  });
  const end = (c, from, to) => { const res = []; for (let k = 1; k < 8; k++) { const t = from + (to - from) * k / 8; res.push([c[0] + Math.cos(t) * r, c[1] + Math.sin(t) * r]); } return res; };
  const m = pts.length - 1, a0 = Math.atan2(pts[1][1] - pts[0][1], pts[1][0] - pts[0][0]), a1 = Math.atan2(pts[m][1] - pts[m - 1][1], pts[m][0] - pts[m - 1][0]);
  return [...Lf, ...end(pts[m], a1 + Math.PI / 2, a1 - Math.PI / 2), ...Rt.reverse(), ...end(pts[0], a0 - Math.PI / 2, a0 - Math.PI * 1.5)];
}

// A filled shape with an ink outline. col: a colour, 'paper' or 'black'.
function shape(pts, col, { w = 1.2 } = {}) {
  if (col === 'paper') flat(pts, PAPERW);
  else if (col === 'black') flat(pts, HAIR);
  else fill(pts, col, { dx: 0.5, dy: 0.4, amp: 0.3 });
  line([...pts, pts[0], pts[1]], { w, over: 0, amp: 0.25 });
}
function blot(pts, col) { flat(pts, col); }

const _HEAD = { c: [0, -30.6], r: 6.4 }, _SH = 4.9, _SHY = -23.2, _HIPY = -11.6;
const _POSES = {
  down: { l: [[-6.6, -17.4], [-6.8, -11.6]], r: [[6.6, -17.4], [6.8, -11.6]] },
  wave: { l: [[-6.6, -17.4], [-6.8, -11.6]], r: [[9.2, -26.4], [10.6, -32.6]] },
  up: { l: [[-9.2, -26.4], [-10.6, -32.6]], r: [[9.2, -26.4], [10.6, -32.6]] },
  out: { l: [[-6.6, -17.4], [-6.8, -11.6]], r: [[9.6, -20.6], [14.2, -17.6]] },
  hold: { l: [[-6.4, -17.8], [-2.4, -16.4]], r: [[6.4, -17.8], [2.4, -16.4]] },
};

function _attr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// A person standing at a sheet point.
function person(bx, by, { shirt = PAL.sky, pants = 'black', hair = 'short', arm = 'down', look = 1, kid = false, size = 1, sit = 0, hold = null, say = '' } = {}) {
  const s = 2.1 * size * (kid ? 0.78 : 1), fx = look < 0 ? -1 : 1, pose = _POSES[arm] || _POSES.down;
  const L = pts => pts.map(([px, py]) => [bx + px * s * fx, by + (py + (sit ? 6 * sit : 0)) * s]);
  const T = (x, y) => L([[x, y]])[0];
  const attrs = 'class="person"' + (say ? ` data-say="${_attr(say)}"` : '');
  group(attrs, () => {
    out.push(`<ellipse cx="${n1(bx)}" cy="${n1(by + 1)}" rx="${n1(7 * s)}" ry="${n1(2.2 * s)}" fill="${SHADOW}" fill-opacity=".7"/>`);
    if (!sit) for (const side of [-1, 1]) {
      const hip = [side * 2.4, _HIPY], f = [side * 2.7, -0.9], knee = [(hip[0] + f[0]) / 2, (_HIPY + f[1]) / 2];
      shape(L(limbOf(_catmull([hip, knee, [f[0], f[1] - 1.6]], 0.8), 1.85)), pants);
      shape(L(oval(f[0] + side * 0.7, f[1] - 0.2, 2.5, 1.35, 12)), 'paper', { w: 1 });
    }
    const armOf = (side, key) => {
      const sh = [side * _SH, _SHY + 0.6], [el, hd] = pose[key];
      shape(L(limbOf(_catmull([sh, el, hd], 0.6), 1.35)), SKIN, { w: 1 });
      const sl = [sh[0] + (el[0] - sh[0]) * 0.62, sh[1] + (el[1] - sh[1]) * 0.62];
      shape(L(capsule(sh, sl, 2.15, 2.0)), shirt, { w: 1 });
    };
    armOf(-1, 'l'); armOf(1, 'r');
    const torso = spline([[-5.7, _SHY - 0.8], [-6.2, -18.4], [-5.6, _HIPY - 0.8], [-4.6, _HIPY + 1.2], [4.6, _HIPY + 1.2], [5.6, _HIPY - 0.8], [6.2, -18.4], [5.7, _SHY - 0.8], [2.4, _SHY - 2.1], [0, _SHY - 1.7], [-2.4, _SHY - 2.1]], true, 0.5);
    shape(L(torso), shirt);
    const hc = _HEAD.c, hr = _HEAD.r, H = pts => L(pts.map(([px, py]) => [px + hc[0], py + hc[1]]));
    shape(L(capsule([0, _SHY - 1.4], [hc[0], hc[1] + hr - 1], 1.6)), SKIN, { w: 0.9 });
    if (hair === 'bob' || hair === 'long') {
      const dn = hair === 'long' ? 9.6 : 4.2;
      shape(H(spline([[-hr - 0.9, dn], [-hr - 1.2, -1], [-hr * 0.7, -hr - 0.6], [0, -hr - 1.3], [hr * 0.7, -hr - 0.6], [hr + 1.2, -1], [hr + 0.9, dn], [hr - 1.6, dn + 0.6], [-hr + 1.6, dn + 0.6]], true, 0.5)), 'black');
    }
    shape(H(oval(0, 0, hr, hr * 0.97, 28)), SKIN);
    for (const sd of [-1, 1]) blot(H(oval(sd * 3.6 + 0.6, 2.1, 1.25, 0.8, 12)), '#f2a3b3');
    for (const sd of [-1, 1]) blot(H(oval(sd * 2.1 + 0.6, 0.4, 0.62, 0.66, 10)), HAIR);
    const arc = [];
    for (let i = 0; i <= 30; i++) { const t = Math.PI + 0.2 + (Math.PI - 0.4) * i / 30; arc.push([Math.cos(t) * (hr + 0.75), Math.sin(t) * (hr + 0.75)]); }
    const fringe = _catmull([[hr + 0.2, -0.4], [hr - 1.6, -2.9], [2, -3.9], [-1.6, -3.6], [-hr + 1.4, -2.6], [-hr - 0.2, -0.2]], 0.4);
    if (hair !== 'cap') shape(H([...arc, ...fringe]), 'black');
    if (hair === 'bun') shape(H(oval(0.4, -hr - 2.4, 2.9, 2.6, 16)), 'black');
    if (hair === 'cap') {
      shape(H(spline([[-hr - 0.6, -1.4], [-hr + 0.4, -5.6], [0, -hr - 1.6], [hr - 0.4, -5.6], [hr + 0.6, -1.4]], true, 0.4)), PAL.red);
      shape(H(spline([[hr * 0.1, -1.6], [hr + 4.6, -1.2], [hr + 4.8, 0.2], [hr * 0.1, -0.2]], true, 0.4)), PAL.red, { w: 0.9 });
    }
    for (const key of ['l', 'r']) {
      const h = T(...pose[key][1]);
      if (hold && key === 'r') hold(h);
      shape(oval(h[0], h[1], 1.55 * s, 1.5 * s, 12), SKIN, { w: 0.95 });
    }
  });
}

function who(x, y, o = {}, z = 0) { const [sx, sy] = P(x, y, z); person(sx, sy, o); }

function cat(x, y, z = 0, col = '#e3c77a') {
  const [bx, by] = P(x, y, z);
  group('class="animal cat"', () => {
    out.push(`<ellipse cx="${n1(bx)}" cy="${n1(by + 1)}" rx="16" ry="4.5" fill="${SHADOW}" fill-opacity=".7"/>`);
    line([[bx + 9, by - 3], [bx + 19, by - 6], [bx + 20, by - 18], [bx + 15, by - 24]], { w: 3.2, col: shadeOf(col), curve: true, over: 0 });
    shape(blob(bx, by - 11, 12, 11), col);
    shape([[bx - 9, by - 27], [bx - 7, by - 37], [bx - 2, by - 30]], col, { w: 1 });
    shape([[bx + 2, by - 30], [bx + 7, by - 37], [bx + 9, by - 27]], col, { w: 1 });
    shape(oval(bx, by - 24, 9.5, 8, 24), col);
    for (const sd of [-1, 1]) blot(oval(bx + sd * 3.4, by - 24.5, 0.9, 1.1, 10), HAIR);
    blot(oval(bx, by - 21.8, 1.1, 0.7, 8), '#c8836b');
    for (const sd of [-1, 1]) blot(oval(bx + sd * 5.6, by - 21.5, 1.4, 0.8, 10), '#f2a3b3');
  });
}

function dog(x, y, z = 0, col = '#cdb68e') {
  const [bx, by] = P(x, y, z);
  group('class="animal dog"', () => {
    out.push(`<ellipse cx="${n1(bx)}" cy="${n1(by + 1)}" rx="22" ry="5" fill="${SHADOW}" fill-opacity=".7"/>`);
    for (const lx of [-12, -6, 8, 14]) shape(capsule([bx + lx, by - 10], [bx + lx, by - 1], 2.4), col, { w: 1 });
    line([[bx - 17, by - 16], [bx - 24, by - 24], [bx - 25, by - 30]], { w: 3, col: shadeOf(col), curve: true, over: 0 });
    shape(capsule([bx - 13, by - 15], [bx + 12, by - 15], 8, 8.5), col);
    shape(oval(bx + 18, by - 26, 9, 8.2, 24), col);
    shape(spline([[bx + 11, by - 31], [bx + 7, by - 22], [bx + 11, by - 18], [bx + 14, by - 27]], true, 0.6), shadeOf(col), { w: 1 });
    blot(oval(bx + 21, by - 27, 0.9, 1.1, 10), HAIR);
    blot(oval(bx + 27, by - 24.5, 1.8, 1.3, 10), HAIR);
  });
}

function bird(x, y, z = 0, col = '#c9d6e6') {
  const [bx, by] = P(x, y, z);
  group('class="animal bird"', () => {
    shape(spline([[bx - 9, by - 4], [bx - 2, by - 9], [bx + 6, by - 8], [bx + 7, by - 2], [bx, by + 1]], true, 0.5), col);
    shape([[bx + 6, by - 7.5], [bx + 10.5, by - 6], [bx + 6.5, by - 4.8]], PAL.mustard, { w: 0.8 });
    line([[bx - 5, by - 5], [bx + 1, by - 3], [bx + 3, by - 6]], { w: 0.9, curve: true, over: 0 });
    blot(oval(bx + 3.6, by - 6.4, 0.8, 0.9, 8), HAIR);
  });
}

function tree(x, y, r = 52, z = 0, col = PAL.leaf) {
  const [bx, by] = P(x, y, z);
  castDisc(x, y, r * 0.45, r * 0.5, z);
  group('class="plant tree"', () => {
    shape([[bx - 4, by], [bx - 3, by - r * 1.1], [bx + 3, by - r * 1.1], [bx + 4, by]], PAL.bark);
    const cy = by - r * 1.45;
    shape(blob(bx, cy, r * 0.62, r * 0.58, 0.07, 6), col);
    const arcs = [];
    for (let i = 0; i < 5; i++) {
      const a = rnd() * 6.28, rr = r * (0.15 + rnd() * 0.3), cx = bx + Math.cos(a) * rr, cyy = cy + Math.sin(a) * rr * 0.9;
      arcs.push([[cx - 5, cyy], [cx, cyy + 3], [cx + 5, cyy]]);
    }
    for (const a of arcs) line(a, { w: 0.8, col: shadeOf(shadeOf(col)), curve: true, over: 0 });
  });
}

// Plants stay round: a soft puff of leaf with one ink line.
function puff(x, y, z, { hw = 18, h = 27, col = PAL.leaf } = {}) {
  const [bx, by] = P(x, y, z);
  group('class="plant puff"', () => {
    shape(blob(bx, by - h * 0.5, hw, h * 0.5, 0.08, 5), col);
    line([[bx - hw * 0.4, by - h * 0.35], [bx, by - h * 0.2], [bx + hw * 0.35, by - h * 0.42]], { w: 0.8, col: shadeOf(shadeOf(col)), curve: true, over: 0 });
  });
}

function pot(x, y, z, plant = true, col = PAL.brick) {
  castDisc(x, y, 10, 22, z);
  turn(x, y, z, [[8, 0], [11, 14], [12, 16]], col, { wall: 1.5, cap: '#7d5a3c', seam: false });
  if (plant) puff(x, y, z + 14, { hw: 14, h: 22 });
}

/* Tinycharts kit: lettering. Title, status, margin notes, tags, pills and the
   footnote. Hand lettering is class "it", small capitals "cap", serif "tt". */

let SHEET_W = 1400, SHEET_H = 1400;
const LEAD = '#5c5650', MUTE = '#9a9187';

// Glyph width per font size, measured in Chrome on ordinary words (Gaegu with
// font-size-adjust .5 and the sheet letter-spacing, Young Serif), rounded up.
const _GLYPH = { it: 0.68, cap: 0.84, tt: 0.6 };
function textW(str, size, cls = 'it') { return String(str).length * size * (_GLYPH[cls] || 0.6); }

function _text(x, y, s, { cls = 'it', size = 16, col = INK, anchor = 'start', extra = '' } = {}) {
  out.push(`<text class="${cls}" x="${n1(x)}" y="${n1(y)}" font-size="${size}" fill="${col}"` +
    (anchor === 'start' ? '' : ` text-anchor="${anchor}"`) + (extra ? ' ' + extra : '') + `>${_attr(s)}</text>`);
}

function title(kicker, big, x = 72) {
  if (kicker) _text(x, 112, kicker, { cls: 'cap kicker', size: 16, extra: 'letter-spacing="2"' });
  _text(x - 4, 190, big, { cls: 'tt title', size: 70, extra: 'letter-spacing="-1"' });
}
function subtitle(str, x = 72) { _text(x, 228, str, { size: 21 }); }

function status(big, small) {
  const x = SHEET_W - 72;
  out.push(`<g id="sheetStatus">`);
  _text(x, 134, big, { size: 27, anchor: 'end', extra: 'id="statusBig"' });
  _text(x, 164, small, { size: 18, col: LEAD, anchor: 'end', extra: 'id="statusSmall"' });
  out.push('</g>');
}

// A hand-drawn ring of n points, closed.
function _ring2(c, r, n = 14) {
  const p = [];
  for (let i = 0; i <= n; i++) {
    const t = (i / n) * 2 * Math.PI, k = 1 + (rnd() - 0.5) * 0.08;
    p.push([c[0] + Math.cos(t) * r * k, c[1] + Math.sin(t) * r * k]);
  }
  return p;
}

// Leader from a margin note to a sheet point: a level run, then one slant.
function _leader(a, b) {
  const sx = Math.sign(b[0] - a[0]) || 1, run = Math.abs(b[1] - a[1]) * 0.58, ex = b[0] - sx * run;
  const pts = sx * (ex - a[0]) > 0 ? [a, [ex, a[1]], b] : [a, b];
  line(pts, { w: 1.05, col: LEAD, over: 0, amp: 0.5 });
  const r = _ring2(a, 3.8);
  out.push(`<path d="${pathOf(r, true)}" fill="${PAPER}"/>`);
  line(r, { w: 1, col: LEAD, over: 0, amp: 0.3 });
  out.push(`<circle class="tip" cx="${n1(b[0])}" cy="${n1(b[1])}" r="2.4" fill="${LEAD}"/>`);
}

function label(tx, ty, ttl, note, to, side = 'start') {
  const q = P(...to), s = side === 'start' ? 1 : -1;
  const w = Math.max(textW(ttl, 20, 'cap'), textW(note || '', 17)) + 16;
  out.push(`<g class="note" data-to="${n1(q[0])},${n1(q[1])}">`);
  _leader([tx + s * w, ty + 18], q);
  _text(tx, ty + 24, ttl, { cls: 'cap', size: 20, anchor: side });
  if (note) _text(tx, ty + 48, note, { size: 17, col: LEAD, anchor: side });
  out.push('</g>');
}

function tag(x, y, w, text) {
  const h = 40, c = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  out.push(`<path d="${pathOf(c, true)}" fill="#fffdf6"/>`);
  rim(c, 1.2);
  out.push(`<circle cx="${n1(x + 10)}" cy="${n1(y + 10)}" r="3" fill="${RED}"/>`);
  _text(x + w / 2, y + 27, text, { cls: 'cap', size: 17, anchor: 'middle' });
}

function pill(sx, sy, text, { lit = false } = {}) {
  const size = 15, w = textW(text, size) + 26, h = 28;
  out.push(`<g class="pill${lit ? ' lit' : ''}"><rect x="${n1(sx - w / 2)}" y="${n1(sy - h / 2)}" width="${n1(w)}" height="${h}" rx="${h / 2}"` +
    ` fill="${lit ? '#f6e6e0' : PAPER}" stroke="${lit ? RED : '#c4bbae'}" stroke-width="${lit ? 1.6 : 1.1}"/>`);
  _text(sx, sy + 5, text, { size, col: lit ? INK : MUTE, anchor: 'middle' });
  out.push('</g>');
}

// Lettering laid flat on a plane: on the floor (top) or on a wall face.
function floorText(x, y, z, s, o = {}) { faceText('top', x, y, z, s, o); }
function faceText(face, x, y, z, s, { size = 16, col = INK, cls = 'it', anchor = 'middle', scale = 1 } = {}) {
  out.push(`<g transform="${faceM(face, x, y, z, scale)}">`);
  _text(0, 0, s, { cls, size, col, anchor });
  out.push('</g>');
}

function footnote(str, maxW = 1256) {
  const size = 14.5, lines = [];
  let cur = '';
  for (const word of String(str).split(/\s+/).filter(Boolean)) {
    const next = cur ? cur + ' ' + word : word;
    if (cur && textW(next, size) > maxW) { lines.push(cur); cur = word; } else cur = next;
  }
  if (cur) lines.push(cur);
  const lead = 21, y0 = SHEET_H - 72 - (lines.length - 1) * lead;
  lines.forEach((l, i) => _text(72, y0 + i * lead, l, { cls: 'it foot', size, col: LEAD }));
}

/* Tinycharts kit: marks. Red floor arrows, the "now" tag, the ring round the
   lit state and the legend. Arrows take world points; the rest sheet points. */

// The head at b, pointing away from a, L long and 2W wide; map takes it to the sheet.
function _head(a, b, L, col, map = p => p) {
  const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, u = [(b[0] - a[0]) / l, (b[1] - a[1]) / l], v = [-u[1], u[0]], W = 6.5;
  const head = [b, [b[0] - u[0] * L + v[0] * W, b[1] - u[1] * L + v[1] * W], [b[0] - u[0] * L - v[0] * W, b[1] - u[1] * L - v[1] * W]];
  out.push(`<path class="head" d="${pathOf(head.map(map), true)}" fill="${col}"/>`);
}

function arrow(pts, o = {}) {
  const z = p => p[2] || 0, [a, b] = pts.slice(-2);
  line(pts.map(p => P(p[0], p[1], z(p))), { w: 1.8, col: RED, amp: 0.55, over: 0, ...o });
  _head(a, b, 15, RED, p => P(p[0], p[1], z(b)));
}

function route(a, b, horizontalFirst = true) {
  const mid = horizontalFirst ? [b[0], a[1]] : [a[0], b[1]];
  arrow([a, mid, b]);
}

// The same red arrow on sheet points, for a chain of tags drawn flat on the
// paper. dashed is for a way back.
function flowArrow(pts, { dashed = false, col = RED, w = 1.8 } = {}) {
  if (dashed) out.push(`<path d="${pathOf(pts)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>`);
  else line(pts, { w, col, amp: 0.55, over: 0 });
  _head(...pts.slice(-2), 14, col);
}

function nowTag(sx, sy) {
  const w = 46, h = 22;
  out.push(`<g class="now"><path d="${pathOf([[sx - w / 2, sy - h], [sx + w / 2, sy - h], [sx + w / 2, sy], [sx + 5, sy], [sx, sy + 7], [sx - 5, sy], [sx - w / 2, sy]], true)}" fill="${RED}"/>` +
    `<text class="cap" x="${n1(sx)}" y="${n1(sy - 6)}" font-size="14" fill="${PAPER}" text-anchor="middle">now</text></g>`);
}

function litRing(pts) {
  out.push('<g class="lit">');
  line([...pts, pts[0], pts[1]], { w: 2.4, col: RED, amp: 0.6, over: 0 });
  out.push('</g>');
}

function legend(items, sx, sy) {
  let x = sx;
  for (const { col, text } of items) {
    const sw = [[x, sy - 13], [x + 18, sy - 13], [x + 18, sy + 3], [x, sy + 3]];
    fill(sw, col, { amp: 0.3 });
    rim(sw, 1);
    out.push(`<text class="it" x="${n1(x + 26)}" y="${n1(sy)}" font-size="16" fill="${INK}">${_attr(text)}</text>`);
    x += 26 + textW(text, 16) + 28;
  }
}

// A tape on the floor along world x, from x0 at world y, len long. Each span
// gets a stretch to scale with its sec. Returns [{a, b, m}] in world x.
function tape(x0, y, len, spans, { w = 36, z = 0 } = {}) {
  const sum = spans.reduce((t, s) => t + s.sec, 0);
  let a = x0;
  return spans.map(s => {
    const b = a + len * s.sec / sum, r = { a, b, m: (a + b) / 2 };
    box(a, y - w / 2, z, b - a, w, 4, { top: s.col, left: shadeOf(s.col), ink: 1, marks: false });
    a = b;
    return r;
  });
}

// A clock face at a sheet point, its hands at min minutes after midnight.
// Each hand sits in its own group, so sweep can turn it.
function dial(sx, sy, r, min) {
  out.push(`<g class="dial" data-cx="${n1(sx)}" data-cy="${n1(sy)}">`);
  const o = oval(sx, sy, r, r, 30);
  fill(o, '#fffdf6', { amp: 0.2 }); rim(o, 1.4);
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 6, i = k % 3 ? r - 6 : r - 10;
    line([[sx + Math.sin(a) * i, sy - Math.cos(a) * i], [sx + Math.sin(a) * (r - 3), sy - Math.cos(a) * (r - 3)]], { w: k % 3 ? 0.8 : 1.4, over: 0 });
  }
  for (const [per, len, w, col] of [[720, 0.55, 2.8, INK], [60, 0.8, 1.6, RED]]) {
    out.push(`<g transform="rotate(${n1((min % per) / per * 360)} ${n1(sx)} ${n1(sy)})"><g class="hand" data-per="${per}">`);
    line([[sx, sy + 4], [sx, sy - r * len]], { w, col, over: 0, amp: 0.2 });
    out.push('</g></g>');
  }
  out.push(`<circle cx="${n1(sx)}" cy="${n1(sy)}" r="2.6" fill="${INK}"/></g>`);
}

// An hourglass standing on world point (x, y, z). left is the share of the
// sand still in the top bulb, from 1 to 0. For a step with no fixed time.
function hourglass(x, y, z = 0, { h = 64, left = 1, col = PAL.wood } = {}) {
  castDisc(x, y, 18, h, z);
  cyl(x, y, z, 20, 5, col, { cap: litOf(col) });
  const [cx, base] = P(x, y, z + 5), top = base - (h - 10), mid = (base + top) / 2, R = 15;
  const bulb = s => spline([[cx - 2, mid], [cx - R, mid + s * (h - 10) * 0.28], [cx - R + 3, mid + s * (h - 10) * 0.46], [cx + R - 3, mid + s * (h - 10) * 0.46], [cx + R, mid + s * (h - 10) * 0.28], [cx + 2, mid]], true, 1.5);
  const up = bulb(-1), down = bulb(1);
  flat(up, '#eef3f5'); flat(down, '#eef3f5');
  const sand = PAL.mustard, k = Math.max(0, Math.min(1, left));
  if (k > 0) group('class="sand top"', () => blot(spline([[cx - 2, mid - 2], [cx - R * 0.85 * Math.sqrt(k), mid - (h - 10) * 0.3 * k], [cx + R * 0.85 * Math.sqrt(k), mid - (h - 10) * 0.3 * k]], true, 1.5), sand));
  group('class="sand bottom"', () => {
    const p = (1 - k) * (h - 10) * 0.32 + 2;
    blot(spline([[cx - R + 3, base - 1], [cx, base - 1 - p], [cx + R - 3, base - 1]], true, 1.5), sand);
  });
  if (k > 0 && k < 1) out.push(`<path class="stream" d="M${n1(cx)} ${n1(mid)}V${n1(base - 3)}" stroke="${shadeOf(sand)}" stroke-width="1.2" stroke-dasharray="2 3"/>`);
  rim(up, 1); rim(down, 1);
  for (const dx of [-R - 3, R + 3]) line([[cx + dx, base], [cx + dx, top]], { w: 2.2, col: shadeOf(col), over: 0 });
  cyl(x, y, z + h - 5, 20, 5, col, { cap: litOf(col) });
}

// Logos printed on a face of a solid. The build defines LOGOS (key →
// {viewBox, body, tint?}) before the kit; a sheet with no logos has none.

const _logos = () => (typeof LOGOS === 'undefined' ? {} : LOGOS);
const _f4 = v => String(Math.round(v * 1e4) / 1e4);

// A w by h box on a face, its top-left corner (as seen) at world (x, y, z).
// 'front' is flat to the viewer, with (x, y, z) at the middle of its top edge.
// The logo fits inside it with pad on each side, keeping its shape; with no
// logo, the name is lettered instead. The logo sits on a light plate, so its
// colours read on any face colour.
function logoOn(face, x, y, z, w, h, key, { fallback, pad = 0.08 } = {}) {
  const [e, f] = P(x, y, z);
  out.push(`<g transform="${face === 'front' ? `translate(${n1(e - w / 2)} ${n1(f)})` : faceM(face, x, y, z)}">`);
  _logoFace(w, h, key, fallback, pad);
  out.push('</g>');
}

function _logoFace(w, h, key, fallback, pad = 0.08) {
  const lg = _logos()[key], iw = w * (1 - 2 * pad), ih = h * (1 - 2 * pad);
  if (lg) {
    const [vx, vy, vw, vh] = lg.viewBox, s = Math.min(iw / vw, ih / vh), m = Math.min(w, h) * 0.06;
    const u0 = Math.max(0, (w - vw * s) / 2 - m), v0 = Math.max(0, (h - vh * s) / 2 - m), u1 = w - u0, v1 = h - v0;
    const plate = [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];
    flat(plate, '#fbf8f1'); rim(plate, 1);
    out.push(`<g transform="translate(${_f4((w - vw * s) / 2)} ${_f4((h - vh * s) / 2)}) scale(${_f4(s)}) translate(${_f4(-vx)} ${_f4(-vy)})"${lg.tint ? ` fill="${lg.tint}"` : ''}>${lg.body}</g>`);
  } else {
    const t = fallback || key, size = Math.min(h * 0.3, iw / textW(t, 1, 'cap'));
    _text(w / 2, h / 2 + size * 0.35, t, { cls: 'cap', size: Math.round(size * 10) / 10, col: INK, anchor: 'middle' });
  }
}

// A logo wrapped round an upright cylinder (centre x, y, radius r), its top
// edge at ztop and its middle at angle mid (radians from +x towards +y).
// SVG cannot bend a drawing, so the logo is drawn once and shown in thin
// vertical strips, each on the plane that touches the curve there.
let _wraps = 0;
function logoWrap(x, y, ztop, r, w, h, key, { fallback, mid = 0.45, strips = 10 } = {}) {
  const n = out.length;
  _logoFace(w, h, key, fallback);
  const body = out.splice(n).join(''), id = `tcwrap${++_wraps}`, du = w / strips, parts = [];
  let clips = '';
  for (let i = 0; i < strips; i++) {
    const um = (i + 0.5) * du, a = mid - (um - w / 2) / r, tx = Math.sin(a), ty = -Math.cos(a);
    const [e, f] = P(x + r * Math.cos(a) - tx * um, y + r * Math.sin(a) - ty * um, ztop);
    clips += `<clipPath id="${id}-${i}"><rect x="${_f4(i * du - 0.2)}" y="-2" width="${_f4(du + 0.4)}" height="${_f4(h + 4)}"/></clipPath>`;
    parts.push(`<g transform="matrix(${_f4(C * (tx - ty))} ${_f4(S * (tx + ty))} 0 1 ${n1(e)} ${n1(f)})"><g clip-path="url(#${id}-${i})"><use href="#${id}"/></g></g>`);
  }
  out.push(`<defs><g id="${id}">${body}</g>${clips}</defs>`, ...parts);
}

// The base objects for technical sheets: each technology is drawn as an
// object for its role, with its logo printed on the +x face (spec 6.1).
// Every object stands on its footprint centre (x, y, z) and returns its
// size {w, d, h} in world units, so a sheet can lay them out.

function _onFace(face, x, y, z, fn) { out.push(`<g transform="${faceM(face, x, y, z)}">`); fn(); out.push('</g>'); }
const _rectL = (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1]];

// The logo, or the label in letters; nothing when the object has neither.
function _sign(face, x, y, z, w, h, o) {
  if (o.logo || o.label) logoOn(face, x, y, z, w, h, o.logo || '', { fallback: o.label });
}

function rack(x, y, z = 0, o = {}) {
  const W = 50, D = 50, U = 22, G = 3, H = 3 * U + 2 * G, x0 = x - W / 2, y0 = y - D / 2;
  cast(x0, y0, W, D, H, z);
  for (let u = 0; u < 3; u++) {
    const zu = z + u * (U + G);
    box(x0, y0, zu, W, D, U, { left: o.col || PAL.grey, marks: false });
    _onFace('left', x0, y0 + D, zu + U, () => {
      rule([6, 10, 14].map(v => [[5, v], [W - 16, v]]), INK, 0.5);
      flat(oval(W - 8, 8, 1.8, 1.8, 10), u === 1 ? PAL.leaf : PAL.mustard);
    });
  }
  _sign('right', x0 + W, y0 + D, z + H, D, H, o);
  return { w: W, d: D, h: H };
}

// A round body has no flat side, so its logo wraps round the near curve.
function _sticker(x, y, ztop, r, h, o) { if (o.logo || o.label) logoWrap(x, y, ztop, r, 1.4 * r, h, o.logo || '', { fallback: o.label }); }

function dbCyl(x, y, z = 0, o = {}) {
  const r = 26, H = 62;
  castDisc(x, y, r, H, z);
  cyl(x, y, z, r, H, o.col || PAL.sand);
  for (const k of [1 / 3, 2 / 3]) line(_front(x, y, z + H * k, r), { w: 1, over: 0 });
  _sticker(x, y, z + H * 0.86, r, H * 0.68, o);
  return { w: 2 * r, d: 2 * r, h: H };
}

function queue(x, y, z = 0, o = {}) {
  const W = 34, D = 96, H = 34, x0 = x - W / 2, y0 = y - D / 2;
  cast(x0, y0, W, D, H, z);
  box(x0, y0, z, W, D, H, { left: o.col || PAL.butter, marks: false });
  _onFace('top', x0, y0, z + H, () => rule([24, 48, 72].map(v => [[2, v], [W - 2, v]]), INK, 0.7));
  _sign('right', x0 + W, y0 + D, z + H, D, H, o);
  return { w: W, d: D, h: H };
}

function gateway(x, y, z = 0, o = {}) {
  const col = o.col || PAL.stone;
  cast(x - 9, y - 38, 18, 76, 108, z);
  box(x - 7, y - 36, z, 14, 14, 66, { left: col, marks: false });
  box(x - 7, y + 22, z, 14, 14, 66, { left: col, marks: false });
  box(x - 9, y - 38, z + 66, 18, 76, 14, { left: PAL.slate, marks: false });
  box(x - 3, y - 26, z + 80, 6, 52, 28, { left: PAL.cream, marks: false });
  _sign('right', x + 3, y + 26, z + 108, 52, 28, o);
  return { w: 18, d: 76, h: 108 };
}

function browser(x, y, z = 0, o = {}) {
  cast(x - 14, y - 42, 28, 84, 80, z);
  box(x - 14, y - 14, z, 28, 28, 4, { left: PAL.grey, marks: false });
  box(x - 3, y - 3, z + 4, 6, 6, 16, { left: PAL.grey, marks: false });
  box(x - 4, y - 42, z + 20, 8, 84, 60, { left: o.col || PAL.stone, marks: false });
  _onFace('right', x + 4, y + 42, z + 80, () => {
    fill(_rectL(3, 3, 81, 57), PAL.cream, { amp: 0.3 });
    fill(_rectL(3, 3, 81, 12), PAL.sky, { amp: 0.3 });
    [PAL.rose, PAL.mustard, PAL.sage].forEach((c, i) => flat(oval(8 + i * 5, 7.5, 1.6, 1.6, 10), c));
    flat(_rectL(24, 5, 70, 10), '#fbf8f1');
    rim(_rectL(3, 3, 81, 57), 0.8);
  });
  _sign('right', x + 4, y + 39, z + 66, 78, 44, o);
  return { w: 28, d: 84, h: 80 };
}

function phone(x, y, z = 0, o = {}) {
  cast(x - 4, y - 18, 8, 36, 66, z);
  box(x - 4, y - 18, z, 8, 36, 66, { left: o.col || PAL.navy, marks: false });
  _onFace('right', x + 4, y + 18, z + 66, () => {
    fill(_rectL(3, 7, 33, 58), PAL.sky, { amp: 0.3 });
    rule([[[14, 4], [22, 4]]], INK, 1.2);
    rim(oval(18, 62, 1.8, 1.8, 10), 0.7);
  });
  _sign('right', x + 4, y + 15, z + 56, 30, 44, o);
  return { w: 8, d: 36, h: 66 };
}

// A cloud is a flat sign in the +x plane with a little depth behind it. Its
// outline is the union of a few circles, traced from the middle outwards.
const _PUFFS = [[22, 30, 16], [44, 22, 21], [66, 28, 16], [80, 38, 11], [9, 40, 10]];
function _cloudLine() {
  const cu = 46, cv = 36, pts = [];
  for (let i = 0; i < 72; i++) {
    const t = i / 72 * 2 * Math.PI, du = Math.cos(t), dv = Math.sin(t);
    let far = 0;
    for (const [u, v, r] of _PUFFS) {
      const ou = cu - u, ov = cv - v, b = ou * du + ov * dv, c = ou * ou + ov * ov - r * r, q = b * b - c;
      if (q >= 0) far = Math.max(far, -b + Math.sqrt(q));
    }
    if (dv > 0) far = Math.min(far || 99, (50 - cv) / dv);
    pts.push([cu + du * far, cv + dv * far]);
  }
  return pts;
}
function cloud(x, y, z = 0, o = {}) {
  const top = z + 76, outline = _cloudLine(), col = o.col || PAL.cream;
  castDisc(x, y, 30, 20, z);
  _onFace('right', x - 10, y + 46, top, () => { fill(outline, shadeOf(col), { amp: 0.4 }); rim(outline, 1); });
  _onFace('right', x, y + 46, top, () => { fill(outline, col, { amp: 0.4 }); rim(outline, 1.4); });
  _sign('right', x, y + 24, top - 16, 48, 30, o);
  return { w: 20, d: 92, h: 76 };
}

function bucket(x, y, z = 0, o = {}) {
  castDisc(x, y, 26, 44, z);
  turn(x, y, z, [[20, 0], [26, 44]], o.col || PAL.sage, { wall: 2 });
  _sticker(x, y, z + 40, 24, 32, o);
  return { w: 52, d: 52, h: 44 };
}

function devbox(x, y, z = 0, o = {}) {
  cast(x - 24, y - 26, 48, 52, 40, z);
  box(x - 22, y - 26, z, 44, 52, 4, { left: PAL.grey, marks: false });
  _onFace('top', x - 18, y - 22, z + 4, () => rule([6, 12, 18, 24, 30].map(u => [[u + 14, 4], [u + 14, 40]]), INK, 0.4));
  box(x - 24, y - 26, z + 4, 4, 52, 36, { left: o.col || PAL.slate, marks: false });
  _onFace('right', x - 20, y + 26, z + 40, () => fill(_rectL(3, 3, 49, 33), PAL.sky, { amp: 0.3 }));
  _sign('right', x - 20, y + 23, z + 37, 46, 30, o);
  return { w: 48, d: 52, h: 40 };
}

function lock(x, y, z = 0, o = {}) {
  cast(x - 8, y - 22, 16, 44, 58, z);
  _onFace('right', x, y + 16, z + 58, () => {
    const u = [[6, 24], [6, 12], [10, 4], [16, 1], [22, 4], [26, 12], [26, 24]];
    line(u, { w: 6, col: INK, over: 0, curve: true });
    line(u, { w: 3.4, col: PAL.grey, over: 0, curve: true });
  });
  box(x - 8, y - 22, z, 16, 44, 36, { left: o.col || PAL.mustard, marks: false });
  _sign('right', x + 8, y + 22, z + 36, 44, 36, o);
  return { w: 16, d: 44, h: 58 };
}

function container(x, y, z = 0, o = {}) {
  const W = 40, D = 92, H = 40, x0 = x - W / 2, y0 = y - D / 2;
  cast(x0, y0, W, D, H, z);
  box(x0, y0, z, W, D, H, { left: o.col || PAL.brick, marks: false });
  _onFace('left', x0, y0 + D, z + H, () => rule([8, 16, 24, 32].map(u => [[u, 3], [u, H - 3]]), INK, 0.6));
  _onFace('right', x0 + W, y0 + D, z + H, () => {
    rule([6, 12, 80, 86].map(u => [[u, 3], [u, H - 3]]), INK, 0.6);
    fill(_rectL(18, 8, 74, 32), PAL.cream, { amp: 0.3 });
  });
  _sign('right', x0 + W, y0 + D - 18, z + H - 8, 56, 24, o);
  return { w: W, d: D, h: H };
}

// A message in flight: a flat envelope, flap up. It casts no shadow, so it
// can float above the objects it passes.
function message(x, y, z = 0, o = {}) {
  const W = 44, D = 64, H = 8, x0 = x - W / 2, y0 = y - D / 2;
  box(x0, y0, z, W, D, H, { left: o.col || PAL.cream, marks: false });
  _onFace('top', x0, y0, z + H, () => line([[1, 1], [W * 0.55, D / 2], [1, D - 1]], { w: 1, over: 0 }));
  return { w: W, d: D, h: H };
}

// ---- tech(): a technology by name, through the table the build embeds
const _norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
function _lev(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}

function tech(name, x, y, z = 0, o = {}) {
  const table = typeof TECH === 'undefined' ? {} : TECH, n = _norm(name), near = [];
  for (const [key, e] of Object.entries(table)) {
    const all = [key, e.name, ...(e.alias || [])].map(_norm);
    if (all.includes(n)) {
      const draw = { rack, dbCyl, queue, gateway, browser, phone, cloud, bucket, devbox, lock, container }[e.object];
      return draw(x, y, z, { logo: key, label: e.name, ...o });
    }
    near.push([key, Math.min(...all.map(a => _lev(n, a)))]);
  }
  const best = near.sort((p, q) => p[1] - q[1]).slice(0, 3).map(([k]) => k);
  throw new Error(`Unknown technology "${name}". Closest: ${best.join(', ')}.`);
}

// Motion. Durations and curves follow the LottieFiles motion-design tables:
// on-screen moves ease in and out, a move takes longer the further it goes,
// and nothing moves in a still page (bare or export), so pictures match.

const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);

// A puff of steam or smoke: rises by (dx, dy), grows from s0 to s1, fades in
// its last 30%. k runs 0..1. The puff sits at sheet point data-x, data-y.
function rise(el, k, dx, dy, s0, s1) {
  const x = +el.dataset.x, y = +el.dataset.y, s = s0 + (s1 - s0) * k;
  el.setAttribute('transform', `translate(${n1(x + dx * k)} ${n1(y + dy * k)}) scale(${s.toFixed(2)}) translate(${-x} ${-y})`);
  el.style.opacity = k < 0.7 ? '1' : ((1 - k) / 0.3).toFixed(2);
}

// Someone pacing: to the end of world path pts and back, at speed world
// units a second, with a small bob for each step.
function stroll(el, pts, t, speed, phase = 0) {
  const seg = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
  const L = seg.reduce((a, b) => a + b, 0) || 1, u = (((t * speed + phase) % (2 * L)) + 2 * L) % (2 * L);
  let r = u < L ? u : 2 * L - u, i = 0;
  while (i < seg.length - 1 && r > seg[i]) { r -= seg[i]; i++; }
  const f = r / (seg[i] || 1), x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, y = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f;
  const a = P(...pts[0]), b = P(x, y), bob = Math.abs(Math.sin(t * 7 + phase)) * 3;
  el.setAttribute('transform', `translate(${n1(b[0] - a[0])} ${n1(b[1] - a[1] - bob)})`);
}

// Page-move time scaled by distance, as in the tables, but at 650 ms for
// 100 px, not 450: the table time is for a page, and a reader follows a
// sheet's move as the story, so the table time read as a jump.
const _FAR = [[0, 0.8], [50, 0.8], [100, 1], [200, 1.3], [300, 1.5], [400, 1.6], [800, 2]];
function glideMs(d) {
  let i = 1;
  while (i < _FAR.length - 1 && d > _FAR[i][0]) i++;
  const [d0, s0] = _FAR[i - 1], [d1, s1] = _FAR[i], k = Math.min(1, Math.max(0, (d - d0) / (d1 - d0)));
  return Math.round(650 * (s0 + (s1 - s0) * k));
}

// Moves a drawn thing from world point a to b on a low arc, with a small
// step back first. Wheels in spin turn as far as they would roll. then()
// runs once at the end, or at once in a still page; redraw there.
function glide(ctx, el, a, b, { then = () => {}, arc = 36, spin = [], radius = 18, clock = null, follow = 0, ms = 0 } = {}) {
  if (ctx.still || !el || !el.animate) { then(); return; }
  const [ax, ay] = P(...a), [bx, by] = P(...b), dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  const N = 24, frames = [];
  ms = ms || glideMs(d);
  for (let j = 0; j <= N; j++) {
    const k = j / N, back = k < 0.2 ? -0.04 * Math.sin(Math.PI * k / 0.2) : 0, u = easeInOut(k) + back;
    frames.push({ offset: k, transform: `translate(${n1(dx * u)}px,${n1(dy * u - arc * Math.sin(Math.PI * easeInOut(k)))}px)` });
  }
  const anims = [el.animate(frames, { duration: ms, fill: 'forwards' })];
  const turn = Math.sign(dx || 1) * (d / radius) * 180 / Math.PI;
  for (const w of spin) {
    w.style.transformBox = 'fill-box'; w.style.transformOrigin = 'center';
    anims.push(w.animate([{ transform: 'rotate(0deg)' }, { transform: `rotate(${n1(turn)}deg)` }], { duration: ms, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' }));
  }
  if (clock) anims.push(..._turn(clock[0], clock[1], clock[2], 0, ms));
  _camFollow(ctx, el, follow);
  _job(ctx, anims, ms, () => { if (follow && ctx.track) ctx.track(null); then(); });
}

// follow: the camera keeps el in view while it moves, follow sheet pixels wide.
function _camFollow(ctx, el, follow) {
  if (follow && ctx.track) ctx.track(el, follow === true ? undefined : follow);
}

// A redraw can replace el before its animation ends, so a timer ends the job too.
function _job(ctx, anims, ms, then) {
  const job = { done: false, finish() {
    if (job.done) return;
    job.done = true;
    clearTimeout(safety);
    for (const x of anims) x.cancel();
    then(); ctx.idle(job);
  } };
  const safety = setTimeout(job.finish, ms + 50);
  anims[0].onfinish = job.finish;
  ctx.busy(job);
  return job;
}

// Moves a drawn thing along world points pts, one low hop per leg, with a
// short rest at each point between: a message going from hop to hop.
function hops(ctx, el, pts, { then = () => {}, arc = 24, rest = 140, clock = null, follow = 0 } = {}) {
  if (ctx.still || !el || !el.animate || pts.length < 2) { then(); return; }
  const s = pts.map(p => P(...p)), d = s.map(([x, y]) => [x - s[0][0], y - s[0][1]]);
  const legs = d.slice(1).map((p, i) => [d[i], p, glideMs(Math.hypot(p[0] - d[i][0], p[1] - d[i][1]))]);
  const ms = hopsMs(pts, { rest }), N = 12, frames = [];
  let t = 0;
  legs.forEach(([a, b, lm], i) => {
    for (let j = i ? 1 : 0; j <= N; j++) {
      const k = j / N, u = easeInOut(k);
      frames.push({ offset: (t + lm * k) / ms, transform: `translate(${n1(a[0] + (b[0] - a[0]) * u)}px,${n1(a[1] + (b[1] - a[1]) * u - arc * Math.sin(Math.PI * k))}px)` });
    }
    t += lm;
    if (i < legs.length - 1) { t += rest; frames.push({ offset: t / ms, transform: frames[frames.length - 1].transform }); }
  });
  const anims = [el.animate(frames, { duration: ms, fill: 'forwards' })];
  if (clock) anims.push(..._turn(clock[0], clock[1], clock[2], 0, ms));
  _camFollow(ctx, el, follow);
  _job(ctx, anims, ms, () => { if (follow && ctx.track) ctx.track(null); then(); });
}

// How long hops takes over world points pts, so a sheet can time other
// motion (a floor hand, a dial) to end with it.
function hopsMs(pts, { rest = 140 } = {}) {
  const s = pts.map(p => P(...p));
  return s.slice(1).reduce((t, p, i) => t + glideMs(Math.hypot(p[0] - s[i][0], p[1] - s[i][1])), 0) + rest * Math.max(0, pts.length - 2);
}

// For a thing that a redraw moved from world point a to b: slides it in
// from a, so it follows the main move a beat behind instead of jumping.
function arrive(ctx, el, a, b, { delay = 0 } = {}) {
  if (ctx.still || !el || !el.animate || (a[0] === b[0] && a[1] === b[1])) return;
  const [ax, ay] = P(...a), [bx, by] = P(...b);
  el.animate([{ transform: `translate(${n1(ax - bx)}px,${n1(ay - by)}px)` }, { transform: 'translate(0px,0px)' }],
    { duration: glideMs(Math.hypot(ax - bx, ay - by)), delay, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'backwards' });
}

// Turns the hands of a dial (drawn by dial) on from m0 to m1 minutes in ms,
// easing in and out like the move it rides with; back if m1 < m0. The
// redraw after the move puts the hands at the new time for good.
function sweep(ctx, el, m0, m1, ms) {
  return ctx.still ? [] : _turn(el, m0, m1, 0, ms);
}

// For a dial that a redraw already drew at m1: turns its hands in from m0.
function sweepIn(ctx, el, m0, m1, ms) {
  return ctx.still ? [] : _turn(el, m0, m1, m0 - m1, ms);
}

// The hands turn through their transform attribute, about the dial centre in
// their own units. A CSS transform-origin in view-box units moves with the
// camera's view box, which sent the hands off the dial on a zoomed sheet.
// el may be the dial or a group round it: sheets pass either.
function _turn(el, m0, m1, base, ms) {
  const d = el && (el.dataset && el.dataset.cx ? el : el.querySelector && el.querySelector('.dial'));
  if (!d) return [];
  const { cx, cy } = d.dataset;
  return [...d.querySelectorAll('.hand')].map(h => _raf(ms, k => {
    h.setAttribute('transform', `rotate(${n1((base + (m1 - m0) * easeInOut(k)) / +h.dataset.per * 360)} ${cx} ${cy})`);
  }));
}

// A frame loop with the face of an Animation: step(k) gets k from 0 to 1,
// cancel() stops it, onfinish runs after the last step.
function _raf(ms, step) {
  const a = { step, onfinish: null, done: false, cancel() { a.done = true; } };
  step(0);
  if (typeof requestAnimationFrame !== 'function') return a;
  const t0 = performance.now();
  const f = now => {
    if (a.done) return;
    const k = Math.min(1, Math.max(0, (now - t0) / ms));
    step(k);
    if (k < 1) requestAnimationFrame(f);
    else { a.done = true; if (a.onfinish) a.onfinish(); }
  };
  requestAnimationFrame(f);
  return a;
}

// Walks a drawn thing along world points pts at a steady pace, with a small
// step bob: one smooth move, no stops. onStep(k, d, [sx, sy]) runs each frame
// with the distance d walked in sheet pixels, to leave a trail behind.
function walk(ctx, el, pts, { then = () => {}, ms = 0, bob = 2.5, follow = 0, clock = null, onStep = null } = {}) {
  const sp = pts.map(p => P(...p));
  const seg = sp.slice(1).map((p, i) => Math.hypot(p[0] - sp[i][0], p[1] - sp[i][1])), L = seg.reduce((a, b) => a + b, 0);
  ms = ms || Math.min(4200, Math.max(1200, L * 8));
  if (ctx.still || !el || sp.length < 2) { then(); return; }
  if (clock) sweep(ctx, clock[0], clock[1], clock[2], ms);
  _camFollow(ctx, el, follow);
  tween(ctx, ms, k => {
    let r = k * L, i = 0;
    while (i < seg.length - 1 && r > seg[i]) { r -= seg[i]; i++; }
    const f = seg[i] ? r / seg[i] : 0, x = sp[i][0] + (sp[i + 1][0] - sp[i][0]) * f, y = sp[i][1] + (sp[i + 1][1] - sp[i][1]) * f;
    el.style.transform = `translate(${n1(x - sp[0][0])}px,${n1(y - sp[0][1] - Math.abs(Math.sin(k * L / 9)) * bob)}px)`;
    if (onStep) onStep(k, k * L, [x, y]);
  }, () => { if (follow && ctx.track) ctx.track(null); then(); });
}

// Redraws the sheet, then fades the old picture out over the new one, so
// what a redraw changes (a light, a fire, a sign) changes softly.
function crossfade(ctx, redraw, ms = 650) {
  const art = typeof document !== 'undefined' && document.getElementById('art');
  if (ctx.still || !art || !art.cloneNode) { redraw(); return; }
  const old = art.cloneNode(true);
  // the copy keeps no ids, so lookups and url(#…) find the new picture
  old.removeAttribute('id');
  for (const el of old.querySelectorAll('[id]')) el.removeAttribute('id');
  old.setAttribute('pointer-events', 'none');
  redraw();
  art.after(old);
  tween(ctx, ms, k => { old.setAttribute('opacity', (1 - k).toFixed(3)); }, () => old.remove());
}

// Runs step(k), k from 0 to 1 eased, on each frame for ms, under the
// animation lock like glide; then() once at the end. For a move the kit has
// no helper for: a level that rises, a hand on a big dial, a belt.
// Returns the job: job.finish() jumps to the end, for a drag that cuts in.
function tween(ctx, ms, step, then = () => {}) {
  if (ctx.still) { step(1); then(); return null; }
  return _job(ctx, [_raf(ms, k => step(easeInOut(k)))], ms, then);
}

<script>/* Tinycharts logic panel: the checked rules and the statechart drawn by pele.
   It runs before app.js, so it hears every tc:state, and builds itself once
   the page has loaded. */
(() => {
  let now = null;
  const mark = () => {
    for (const el of document.querySelectorAll('#logic .pele-state[data-id]')) el.classList.toggle('now', el.dataset.id === now);
  };
  document.addEventListener('tc:state', e => { now = e.detail; mark(); });

  document.addEventListener('DOMContentLoaded', () => {
    const key = document.body.dataset.sheet, data = LOGICDATA[key];
    if (!data) return;
    const btn = document.getElementById('logicBtn');
    const panel = document.createElement('aside');
    panel.id = 'logic';
    panel.hidden = true;
    panel.innerHTML = `<header><h2>The logic</h2><button class="close" aria-label="Close">&times;</button></header>
      <p class="intro">Each rule below holds on every path through a small model of this drawing. The line under it says how it would break.</p>
      <ol class="rules"></ol>
      <div class="tools"><button data-z="out" aria-label="Zoom out">&minus;</button><span class="pct">100%</span><button data-z="in" aria-label="Zoom in">+</button><button data-z="fit">Fit</button><span class="gap"></span><button data-z="full">Full screen</button></div>
      <div class="chart"></div>
      <p class="checked"></p>`;
    for (const r of data.rules) {
      const li = document.createElement('li');
      li.innerHTML = '<p class="rule"></p><p class="says"></p><p class="breaks"></p>';
      li.querySelector('.rule').textContent = r.rule;
      li.querySelector('.says').textContent = r.says;
      li.querySelector('.breaks').textContent = 'breaks: ' + r.path;
      panel.querySelector('.rules').append(li);
    }
    panel.querySelector('.checked').textContent = data.checked;
    document.body.append(panel);

    const chart = panel.querySelector('.chart');
    if (PELE[key]) chart.innerHTML = PELE[key];
    else { chart.hidden = true; panel.querySelector('.tools').hidden = true; }

    // zoom: the SVG keeps its own size times a scale; Fit fills the box width
    const svg = chart.querySelector('svg');
    let scale = 1;
    const zoom = s => {
      if (!svg) return;
      scale = Math.min(4, Math.max(0.25, s));
      svg.style.width = svg.getAttribute('width') * scale + 'px';
      svg.style.maxWidth = 'none';
      panel.querySelector('.pct').textContent = Math.round(scale * 100) + '%';
    };
    const fit = () => svg && zoom(Math.min(1, (chart.clientWidth - 24) / svg.getAttribute('width')));
    panel.querySelector('.tools').addEventListener('click', e => {
      const z = e.target.dataset.z;
      if (z === 'in') zoom(scale * 1.25);
      if (z === 'out') zoom(scale / 1.25);
      if (z === 'fit') fit();
      if (z === 'full') chart.requestFullscreen && chart.requestFullscreen();
    });

    chart.addEventListener('click', e => {
      const node = e.target.closest('.pele-state[data-id]');
      if (!node) return;
      for (const el of document.querySelectorAll('#art .peek')) el.classList.remove('peek');
      const hits = document.querySelectorAll(`#art [data-state="${CSS.escape(node.dataset.id)}"]`);
      for (const el of hits) el.classList.add('peek');
      setTimeout(() => hits.forEach(el => el.classList.remove('peek')), 1800);
    });

    const show = on => {
      panel.hidden = !on;
      document.body.classList.toggle('with-logic', on);
      btn.textContent = on ? 'Hide the logic' : 'Show the logic';
      if (on) fit();
    };
    btn.hidden = false;
    btn.onclick = () => show(panel.hidden);
    panel.querySelector('.close').onclick = () => show(false);
    if (new URLSearchParams(location.hash.slice(1)).get('logic') === '1') show(true);
    mark();
  });
})();

/* Tinycharts page shell: runs one sheet, its buttons, the camera and the
   hash. Hash: #sheet=<key>&state=<id>&bare=1&audit=1. A page built with a
   gallery shows the grid of sheets when the hash names no sheet. */
(() => {
  const $ = id => document.getElementById(id);
  const hash = new URLSearchParams(location.hash.slice(1));
  const keys = META.map(m => m.key);
  const key = keys.includes(hash.get('sheet')) ? hash.get('sheet') : keys[0];
  const meta = META.find(m => m.key === key), sheet = SHEETS[key];

      sec.innerHTML = '<h2></h2><div class="row"></div>';
      sec.querySelector('h2').textContent = g;
      for (const e of items) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = '#sheet=' + encodeURIComponent(e.key);
        a.innerHTML = '<b></b><small></small>';
        a.querySelector('b').textContent = e.type;
        a.querySelector('small').textContent = e.question;
        sec.querySelector('.row').append(a);
      }
      grid.append(sec);
    }
    $('stage').replaceChildren(grid);
    fontsLoaded().then(ok => { if (ok) document.body.dataset.ready = '1'; });
    return;
  }

  const entry = gallery && gallery.find(e => e.key === key);
  document.body.dataset.sheet = key;
  document.title = entry ? entry.type : meta.name;
  $('kindName').textContent = entry ? entry.type : meta.name;
  $('kindAbout').textContent = entry ? entry.question : sheet.about;
  if (gallery) $('back').href = '#';
  const at = keys.indexOf(key);
  $('pos').textContent = `${at + 1} / ${keys.length}`;
  $('prev').disabled = at === 0;
  $('next').disabled = at === keys.length - 1;
  $('prev').onclick = () => { location.hash = `sheet=${keys[at - 1]}`; };
  $('next').onclick = () => { location.hash = `sheet=${keys[at + 1]}`; };
  $('pager').hidden = keys.length < 2;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  for (const r of ['paper', 'grid']) { $(r).setAttribute('width', W); $(r).setAttribute('height', H); }
  $('frame').style.setProperty('--ratio', `${W} / ${H}`);
  if (hash.get('bare') === '1') {
    document.body.classList.add('bare');
    svg.setAttribute('width', W); svg.setAttribute('height', H);
  }

  // ---- camera: the view box eases toward a target
  let view = [0, 0, W, H], to = view, dur = 0, back = 0, tracked = null, trackW = 0;
  const setView = v => {

    if (tracked) $('zoom').querySelector('.pct').textContent = Math.round(W / v[2] * 100) + '%';

  const fit = (cx, cy, w) => {

  };

  // A GIF keeps the whole sheet in view: a moving camera changes every pixel

  const fixed = still || hash.get('gif') === '1';
  const moveTo = (v, ms = 900) => {

    to = v; dur = ms;
    $('zoom').querySelector('.pct').textContent = Math.round(W / v[2] * 100) + '%';
  };

  let manual = false;
  const zoomBy = f => { manual = true; moveTo(fit(to[0] + to[2] / 2, to[1] + to[3] / 2, to[2] / f), 300); };
  $('zoom').addEventListener('click', e => {
    const z = e.target.dataset.z;
    tracked = null;
    if (z === 'in') zoomBy(1.25);
